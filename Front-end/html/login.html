{% extends "base.html" %}
{% block title %}Padaria Vitoria | Login{% endblock %}
{% block content %}

<section class="container">
    <div class="form-card">
        <h1>Entrar na conta</h1>

        {% if erro %}
          <div class="form-erros">
            <p class="erro-item">{{ erro }}</p>
          </div>
        {% endif %}

        <form method="POST" action="{{ url_for('login') }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-linha">
                <div class="form-campo">
                    <label>Email</label>
                    <input type="email" name="email" required>
                </div>
                <div class="form-campo">
                    <label>Senha</label>
                <div class="campo-senha-wrapper">
                    <input type="password" name="senha" class="campo-senha" required>
                    <button type="button" class="btn-olho-senha" aria-label="Mostrar senha">
                        <svg class="icone-olho-aberto" viewBox="0 0 24 24" width="20" height="20">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z" fill="none" stroke="currentColor" stroke-width="2"/>
                            <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/>
                        </svg>
                        <svg class="icone-olho-fechado" viewBox="0 0 24 24" width="20" height="20" style="display:none;">
                            <path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a18.5 18.5 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24" fill="none" stroke="currentColor" stroke-width="2"/>
                            <line x1="1" y1="1" x2="23" y2="23" stroke="currentColor" stroke-width="2"/>
                        </svg>
                    </button>
                </div>
                </div>
            </div>
            <button type="submit" class="btn-comprar btn-cadastrar">Entrar</button>

            <a href="{{ url_for('esqueci_senha') }}" class="btn-link-simples" style="display:block; text-align:center; margin-top:12px;">Esqueci minha senha</a>
        </form>
    </div>
</section>
{% endblock %}
