{% extends "base.html" %}
{% block title %}Padaria Vitoria | Editar Endereço{% endblock %}
{% block content %}

<section class="container">
    <div class="form-card">
        <h1>Editar endereço</h1>

        <p style="color: #6b5b4a; font-size: 14px; margin-bottom: 20px;">
            {{ endereco.rua }} - {{ endereco.bairro }}, {{ endereco.cidade }}/{{ endereco.estado }} • CEP {{ endereco.cep }}
        </p>

        <form method="POST" action="{{ url_for('editar_endereco', id_endereco=endereco.id_endereco) }}">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-linha">
                <div class="form-campo">
                    <label>Número</label>
                    <input type="text" name="numero" value="{{ endereco.numero }}" required>
                </div>
                <div class="form-campo campo-grande">
                    <label>Complemento</label>
                    <input type="text" name="complemento" value="{{ endereco.complemento or '' }}">
                </div>
            </div>

            <div class="form-linha">
                <div class="form-campo campo-grande">
                    <label>Referência</label>
                    <input type="text" name="referencia" value="{{ endereco.referencia or '' }}">
                </div>
            </div>

            <button type="submit" class="btn-comprar btn-cadastrar">Salvar alterações</button>
        </form>

        <a href="{{ url_for('perfil') }}" class="btn-link-simples" style="display:block; text-align:center; margin-top:12px;">← Voltar sem salvar</a>
    </div>
</section>
{% endblock %}
