{% extends "base.html" %}
{% block title %}Padaria Vitoria | Cadastrar Funcionário{% endblock %}
{% block content %}

<section class="container">
    <div class="form-card">
        <h1>Cadastrar funcionário</h1>

        {% if erros %}
          <div class="form-erros">
            {% for erro in erros %}
              <p class="erro-item">{{ erro }}</p>
            {% endfor %}
          </div>
        {% endif %}

        <form method="POST" action="{{ url_for('novo_funcionario') }}">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div class="form-linha">
                <div class="form-campo campo-grande">
                    <label>Nome completo</label>
                    <input type="text" name="nome" required>
                </div>
                <div class="form-campo">
                    <label>Telefone</label>
                    <input type="text" name="telefone">
                </div>
            </div>

            <div class="form-linha">
                <div class="form-campo campo-grande">
                    <label>Email</label>
                    <input type="email" name="email" required>
                </div>
                <div class="form-campo">
                    <label>Cargo</label>
                    <input type="text" name="cargo" required>
                </div>
            </div>

            <div class="form-linha">
                <div class="form-campo">
                    <label>Senha</label>
                    <input type="password" name="senha" required>
                </div>
            </div>

            <button type="submit" class="btn-comprar btn-cadastrar">Cadastrar funcionário</button>
        </form>
    </div>
</section>
{% endblock %}
