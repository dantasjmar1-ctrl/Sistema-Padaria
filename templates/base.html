<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Padaria Vitoria{% endblock %}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/LOGO_SITE/V (64 x 64 px)1.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="site-header">
        <a href="{{ url_for('inicio') }}" class="logo-link" aria-label="Padaria Vitoria">
            <img src="{{ url_for('static', filename='img/LOGO_SITE/2.png') }}" class="logo" alt="Padaria Vitoria">
        </a>

        <form class="search-box" action="{{ url_for('cardapio') }}" method="get">
            <label for="busca">Buscar produtos</label>
            <input id="busca" type="text" name="busca" placeholder="Buscar produtos...">
            <button type="submit" aria-label="Buscar">⌕</button>
        </form>

        <nav class="main-menu" aria-label="Menu principal">
            <a href="{{ url_for('inicio') }}">Início</a>
            <a href="{{ url_for('cardapio') }}">Cardápio</a>
            <a href="{{ url_for('inicio') }}#pedidos">Pedidos</a>
            <button type="button">Cadastro</button>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="footer-inner">
            <span class="footer-brand-small">Padaria</span>
            <strong><span>Vitória</span></strong>
            <span class="footer-detalhe"></span>
            <p>© 2026 Padaria Vitória - Todos os direitos reservados</p>
        </div>
    </footer>
</body>
</html>
