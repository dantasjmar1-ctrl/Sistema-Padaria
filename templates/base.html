<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Padaria Vitoria{% endblock %}</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/LOGO_SITE/V (64 x 64 px)1.png') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="site-header">
        <a href="{{ url_for('inicio') }}" class="logo-link" aria-label="Padaria Vitoria">
            <img src="{{ url_for('static', filename='img/LOGO_SITE/2.png') }}" class="logo" alt="Padaria Vitoria">
        </a>

        <form class="search-box" action="{{ url_for('cardapio') }}" method="get">
            <label for="busca">Buscar produtos</label>
            <input id="busca" type="text" name="busca" placeholder="Buscar produtos...">
            <button type="submit" aria-label="Buscar">⌕</button>
        </form>

        <nav class="main-menu" aria-label="Menu principal">
            <a href="{{ url_for('inicio') }}">Início</a>
            <a href="{{ url_for('cardapio') }}">Cardápio</a>
            <a href="{{ url_for('inicio') }}#pedidos">Pedidos</a>
            {% if session.cliente_nome %}
                <div class="menu-perfil">
                    <button type="button" id="btn-perfil" class="cliente-logado">Olá, {{ session.cliente_nome }}</button>
                    <div class="dropdown-perfil" id="dropdown-perfil">
                        <a href="{{ url_for('perfil') }}">Editar perfil</a>
                        <a href="{{ url_for('pedidos') }}">Meus pedidos</a>
                        <a href="{{ url_for('logout') }}">Sair</a>
                    </div>
                </div>
            {% else %}
                <button type="button" id="btn-login">Login</button>
                <button type="button" id="btn-cadastro">Cadastro</button>
            {% endif %}
        </nav>

        <button class="cart-toggle" type="button" aria-label="Abrir carrinho">
            <span class="cart-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24" focusable="false">
                    <path d="M3 4h2l2.5 11h10l2-7H7"/>
                    <circle cx="10" cy="20" r="1.8"/>
                    <circle cx="18" cy="20" r="1.8"/>
                </svg>
            </span>
            <span class="cart-count">0</span>
        </button>
    </header>

    <aside class="cart-panel" aria-label="Carrinho de compras">
        <div class="cart-header">
            <div>
                <span class="cart-kicker">Seu pedido</span>
                <h2>Carrinho</h2>
            </div>
            <button class="cart-close" type="button" aria-label="Fechar carrinho">×</button>
        </div>

        <div class="cart-items">
            <p class="cart-empty">Seu carrinho está vazio.</p>
        </div>

        <div class="cart-footer">
            <div class="cart-total">
                <span>Total</span>
                <strong>R$ 0,00</strong>
            </div>
            <button class="cart-finish" type="button">Finalizar pedido</button>
        </div>
    </aside>
    <div class="cart-overlay"></div>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <div class="footer-inner">
            <span class="footer-brand-small">Padaria</span>
            <strong><span>Vitória</span></strong>
            <span class="footer-detalhe"></span>
            <p>© 2026 Padaria Vitória - Todos os direitos reservados</p>
        </div>
    </footer>
    <script src="{{ url_for('static', filename='js/cart.js') }}"></script>
    <script>
        const btnLogin = document.getElementById('btn-login');
        if (btnLogin) {
            btnLogin.addEventListener('click', function() {
                window.location.href = "{{ url_for('login') }}";
            });
        }

        const btnCadastro = document.getElementById('btn-cadastro');
        if (btnCadastro) {
            btnCadastro.addEventListener('click', function() {
                window.location.href = "{{ url_for('cadastro') }}";
            });
        }

        const btnPerfil = document.getElementById('btn-perfil');
        if (btnPerfil) {
            btnPerfil.addEventListener('click', function() {
                document.getElementById('dropdown-perfil').classList.toggle('aberto');
            });
        }
    </script>
</body>
</html>
